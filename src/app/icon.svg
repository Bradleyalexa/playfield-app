<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="neo-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="16" dy="16" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Outer Sticker Base (Off-white outline) -->
  <rect
    x="18"
    y="18"
    width="476"
    height="476"
    rx="105"
    fill="#fdfbf7"
  />

  <!-- Main Card Shadow (Hard Neo-Brutalist offset) -->
  <rect
    x="44"
    y="44"
    width="430"
    height="430"
    rx="88"
    fill="#000000"
  />

  <!-- Main Card Face (Vibrant Neon Lime) -->
  <rect
    x="30"
    y="30"
    width="430"
    height="430"
    rx="88"
    fill="#d4ff00"
    stroke="#000000"
    stroke-width="22"
    stroke-linejoin="round"
  />

  <!-- Corner Screw Accents -->
  <circle cx="64" cy="64" r="11" fill="#000000" />
  <circle cx="426" cy="64" r="11" fill="#000000" />
  <circle cx="64" cy="426" r="11" fill="#000000" />

  <!-- P-Head Court Grid Shadow -->
  <rect
    x="195"
    y="86"
    width="212"
    height="200"
    rx="42"
    fill="#000000"
  />

  <!-- P-Head Court Grid Body (Cyan) -->
  <rect
    x="184"
    y="76"
    width="212"
    height="200"
    rx="42"
    fill="#00e5ff"
    stroke="#000000"
    stroke-width="20"
    stroke-linejoin="round"
  />

  <!-- Court Grid Lines (Internal 4 tiles) -->
  <line x1="290" y1="76" x2="290" y2="276" stroke="#000000" stroke-width="14" />
  <line x1="184" y1="176" x2="396" y2="176" stroke="#000000" stroke-width="14" />

  <!-- Left Vertical Pillar of P (White) with Shadow -->
  <rect
    x="88"
    y="88"
    width="96"
    height="316"
    rx="28"
    fill="#000000"
  />
  <rect
    x="80"
    y="80"
    width="96"
    height="316"
    rx="28"
    fill="#ffffff"
    stroke="#000000"
    stroke-width="20"
    stroke-linejoin="round"
  />
  <!-- Division line in left pillar -->
  <line x1="80" y1="238" x2="176" y2="238" stroke="#000000" stroke-width="18" />

  <!-- Pink Ball Drop Shadow -->
  <circle cx="348" cy="342" r="76" fill="#000000" />

  <!-- Pink Ball Body -->
  <circle
    cx="336"
    cy="330"
    r="74"
    fill="#ff3366"
    stroke="#000000"
    stroke-width="20"
  />

  <!-- Tennis / Padel Ball Curved White Seams -->
  <path
    d="M 285 304 Q 336 336 387 304"
    fill="none"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
  />
  <path
    d="M 285 356 Q 336 324 387 356"
    fill="none"
    stroke="#ffffff"
    stroke-width="14"
    stroke-linecap="round"
  />
</svg>
